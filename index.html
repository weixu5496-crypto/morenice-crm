\<!DOCTYPE html>
\<html lang="zh-CN">
\<head>
\<meta charset="UTF-8">
\<meta name="viewport" content="width=device-width,initial-scale=1">
\<meta name="theme-color" content="#14243a">
\<title>Morenice CRM | Supply Chain\</title>
\<style>
:root{--navy:#14243a;--blue:#2864dc;--bg:#f4f6fa;--line:#e5e9f0;--text:#202b3c;--muted:#778397;--green:#16845c;--red:#c74747}
\*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{width:225px;background:var(--navy);color:white;padding:25px 14px;flex-shrink:0}
.brand{font-size:21px;font-weight:800;padding:0 12px}
.brand small{display:block;font-size:11px;color:#a9bad0;font-weight:400;margin-top:7px;letter-spacing:1px}
.nav{margin-top:32px}
.nav button{width:100%;border:0;color:#c1ccdc;background:transparent;text-align:left;padding:13px 14px;border-radius:9px;margin:3px 0}
.nav button.active,.nav button:hover{background:#293c57;color:white}
.side-note{font-size:11px;color:#9daec4;line-height:1.8;padding:20px 12px}
main{flex:1;min-width:0}
.topbar{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:10px}
.topbar strong{font-size:16px}
.topbar-right{display:flex;align-items:center;gap:10px}
.lang-select{border:1px solid var(--line);background:white;border-radius:7px;padding:6px 10px;font-size:12px;color:var(--text)}
.content{padding:27px;max-width:1450px;margin:auto}
h1{font-size:25px;margin:0 0 8px}
h2{font-size:17px;margin:0}
.muted{color:var(--muted);font-size:12px;line-height:1.7}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:22px 0}
.stat,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px}
.stat-label{font-size:12px;color:var(--muted)}
.stat-value{font-size:29px;font-weight:750;margin:12px 0 5px}
.panel{margin-bottom:18px;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.btn{border:1px solid var(--line);background:white;border-radius:7px;padding:9px 13px;color:var(--text)}
.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}
.btn.danger{color:var(--red)}
.btn.small{padding:5px 8px;font-size:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
input,select,textarea{width:100%;border:1px solid #dce2eb;border-radius:7px;padding:10px;background:white;color:var(--text);min-width:0}
textarea{resize:vertical;min-height:85px}
label{display:block;font-size:12px;color:#566276;margin-bottom:6px}
.field{margin-bottom:15px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.full{grid-column:1/-1}
.search{max-width:310px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf0f4;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfd}
td{font-size:13px;line-height:1.65}
.badge{display:inline-block;background:#edf3ff;color:#2455ad;border-radius:5px;padding:3px 7px;font-size:11px}
.badge.green{background:#e8f7ef;color:#18744e}
.badge.orange{background:#fff3df;color:#98600a}
.empty{text-align:center;padding:35px;color:var(--muted)}
.hidden{display:none!important}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.note{padding:12px 14px;background:#f0f5ff;border-radius:8px;color:#37547f;font-size:12px;line-height:1.8;margin:14px 0}
footer{text-align:center;color:#99a3b3;font-size:11px;padding:20px}
.mobile-nav{display:none}
dialog{border:0;border-radius:14px;padding:0;width:min(620px,calc(100% - 24px));max-height:90vh;box-shadow:0 18px 70px #14243a35}
dialog::backdrop{background:#14243a80}
.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:22px;overflow-y:auto;max-height:70vh}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
/\* RTL 阿拉伯语适配 \*/
[dir="rtl"] .nav button{text-align:right}
[dir="rtl"] th,[dir="rtl"] td{text-align:right}
[dir="rtl"] .heading{flex-direction:row-reverse}
[dir="rtl"] .side-note{text-align:right}
[dir="rtl"] .brand{text-align:right}
[dir="rtl"] .modal-foot{flex-direction:row-reverse}
[dir="rtl"] .panel-head{flex-direction:row-reverse}
@media(max-width:850px){
&#x20;.sidebar{display:none}.app{display:block}.topbar{padding:0 14px}
&#x20;.content{padding:19px 14px 85px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
&#x20;.stat{padding:15px}.stat-value{font-size:25px}.two-col{grid-template-columns:1fr}
&#x20;.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);z-index:5;overflow-x:auto;padding:5px}
&#x20;.mobile-nav button{flex:1;min-width:66px;border:0;background:white;padding:9px 4px;font-size:11px;color:#637087}
&#x20;.mobile-nav button.active{color:var(--blue);font-weight:700}
&#x20;.form-grid{grid-template-columns:1fr}.full{grid-column:auto}
&#x20;.search{max-width:100%;width:100%}.heading{align-items:flex-start}
}
\</style>
\</head>

let lang = localStorage.getItem("morenice_lang") || "zh";
function t(k){ return (I18N[lang] && I18N[lang][k]) ?? I18N.zh[k] ?? k; }
function tStatus(v){ return t("status."+v) || v; }
function applyDir(){
&#x20;document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";

}

/\* ================= 数据层 ================= \*/
const $ = id => document.getElementById(id);
const STORE = "morenice_crm_test_v1";
const navItems = ["dashboard","leads","followups","quotes","orders","email","settings"];
const emptyDB = () => ({leads:[],followups:[],quotes:[],orders:[]});
let db;
try { db = JSON.parse(localStorage.getItem(STORE)) || emptyDB(); } catch(e){ db = emptyDB(); }
let page = "dashboard";
let editContext = null;

function save(){
&#x20;try{ localStorage.setItem(STORE,JSON.stringify(db)); return true; }
&#x20;catch(e){ alert(t("alert.saveFailed")); return false; }
}
function esc(v){ return String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(n,currency="USD"){ return new Intl.NumberFormat("en-US",{style:"currency",currency:currency,maximumFractionDigits:2}).format(Number(n)||0); }
function dateToday(){ return new Date().toISOString().slice(0,10); }

/\* ================= 导航 ================= \*/
function nav(){
&#x20;const side = navItems.map(id=>\`\<button class="${page===id?"active":""}" onclick="go('${id}')">${t("nav."+id)}\</button>\`).join("");
&#x20;$("sideNav").innerHTML = side;
&#x20;$("mobileNav").innerHTML = navItems.filter(x=>x!=="settings").map(id=>\`\<button class="${page===id?"active":""}" onclick="go('${id}')">${t("nav."+id)}\</button>\`).join("");
&#x20;$("topTitle").textContent = t("nav."+page);
&#x20;$("sideNote").innerHTML = t("side.note");
&#x20;$("footerText").textContent = t("footer");
&#x20;$("modalCloseBtn").textContent = t("common.close");
&#x20;$("modalCancelBtn").textContent = t("common.cancel");
&#x20;$("modalSaveBtn").textContent = t("common.save");
&#x20;$("langSelect").value = lang;
}
function go(id){ page=id; nav(); render(); window\.scrollTo(0,0); }
function changeLang(v){
&#x20;lang = v;
&#x20;localStorage.setItem("morenice_lang", lang);
&#x20;applyDir();
&#x20;nav();
&#x20;render();
}

/\* ================= 通用片段 ================= \*/
function heading(title,desc,button=""){ return \`\<div class="heading">\<div>\<h1>${title}\</h1>\<div class="muted">${desc}\</div>\</div>${button}\</div>\`; }
function stat(title,value,desc){ return \`\<div class="stat">\<div class="stat-label">${title}\</div>\<div class="stat-value">${value}\</div>\<div class="muted">${desc}\</div>\</div>\`; }
function panel(title,body,extra=""){ return \`\<section class="panel">\<div class="panel-head">\<h2>${title}\</h2>${extra}\</div>${body}\</section>\`; }
function btnAdd(type,label){ return \`\<button class="btn primary" onclick="openEditor('${type}')">+ ${label}\</button>\`; }
function table(headers,rows){ return \`\<div class="table-wrap">\<table>\<thead>\<tr>${headers.map(h=>\`\<th>${h}\</th>\`).join("")}\</tr>\</thead>\<tbody>${rows||\`\<tr>\<td colspan="${headers.length}" class="empty">${t("common.empty")}\</td>\</tr>\`}\</tbody>\</table>\</div>\`; }
function actionButtons(type,id){ return \`\<div class="actions">\<button class="btn small" onclick="openEditor('${type}','${id}')">${t("common.edit")}\</button>\<button class="btn small danger" onclick="removeRecord('${type}','${id}')">${t("common.delete")}\</button>\</div>\`; }
function filterBar(type,placeholder){ return \`\<input class="search" placeholder="${placeholder}" oninput="filterTable('${type}',this.value)">\`; }
function filterTable(type,value){ document.querySelectorAll(\`[data-type="${type}"]\`).forEach(row=>{ row\.classList.toggle("hidden",!row\.dataset.search.includes(value.toLowerCase())); }); }

function render(){
&#x20;nav();
&#x20;const el=$("content");
&#x20;if(page==="dashboard") el.innerHTML=dashboard();
&#x20;else if(page==="leads") el.innerHTML=leadsPage();
&#x20;else if(page==="followups") el.innerHTML=followupsPage();
&#x20;else if(page==="quotes") el.innerHTML=quotesPage();
&#x20;else if(page==="orders") el.innerHTML=ordersPage();
&#x20;else if(page==="email") el.innerHTML=emailPage();
&#x20;else if(page==="settings") el.innerHTML=settingsPage();
}

/\* ================= 工作台 ================= \*/
function dashboard(){
&#x20;const active=db.leads.filter(x=>x.status!=="已成交"&&x.status!=="已关闭").length;
&#x20;const pending=db.followups.filter(x=>x.status!=="已完成").length;
&#x20;const revenue=db.orders.reduce((s,x)=>s+(+x.revenue||0),0);
&#x20;const profit=db.orders.reduce((s,x)=>s+(+x.revenue||0)-(+x.cost||0),0);
&#x20;const today=db.followups.filter(x=>x.status!=="已完成"&&x.date&&x.date<=dateToday());
&#x20;const latest=db.leads.slice(-5).reverse();
&#x20;return heading(t("dash.title"),t("dash.desc"))
&#x20;+\`\<div class="stats">${stat(t("dash.totalCustomers"),db.leads.length,t("dash.totalCustomersDesc"))}${stat(t("dash.activeLeads"),active,t("dash.activeLeadsDesc"))}${stat(t("dash.pendingFollowups"),pending,t("dash.pendingFollowupsDesc"))}${stat(t("dash.grossProfit"),money(profit),t("dash.grossProfitDesc"))}\</div>\`
&#x20;+panel(t("dash.todayFollowups"),today.length?table([t("followups.col.customer"),t("followups.col.note"),t("followups.col.date"),t("followups.col.status")],today.map(x=>\`\<tr>\<td>${esc(x.customer)}\</td>\<td>${esc(x.note)}\</td>\<td>${esc(x.date)}\</td>\<td>\<span class="badge orange">${tStatus(x.status)}\</span>\</td>\</tr>\`)):\`\<div class="empty">${t("dash.noTodayFollowups")}\</div>\`)
&#x20;+\`\<div class="two-col">${panel(t("dash.recentLeads"),latest.length?table([t("leads.col.customer"),t("leads.col.country"),t("leads.col.status")],latest.map(x=>\`\<tr>\<td>${esc(x.name)}\</td>\<td>${esc(x.country)}\</td>\<td>${tStatus(x.status)}\</td>\</tr>\`)):\`\<div class="empty">${t("dash.noLeads")}\</div>\`)}${panel(t("dash.overview"),\`\<p>${t("dash.orderRevenue")}: \<strong>${money(revenue)}\</strong>\</p>\<p>${t("dash.orderProfit")}: \<strong>${money(profit)}\</strong>\</p>\<p>${t("dash.customerInquiries")}: \<strong>${db.leads.length}\</strong>\</p>\<p>${t("dash.logisticsQuotes")}: \<strong>${db.quotes.length}\</strong>\</p>\<div class="note">${t("dash.tip")}\</div>\`)}\</div>\`;
}

function ordersPage(){
&#x20;const revenue=db.orders.reduce((s,x)=>s+(+x.revenue||0),0);
&#x20;const cost=db.orders.reduce((s,x)=>s+(+x.cost||0),0);
&#x20;const profit=revenue-cost;
&#x20;const rows=db.orders.map(x=>{
&#x20; const p=(+x.revenue||0)-(+x.cost||0);
&#x20; const margin=(+x.revenue||0)?(p/(+x.revenue||1)\*100):0;
&#x20; return \`\<tr data-type="orders" data-search="${esc([x.customer,x.route,x.status].join(" ").toLowerCase())}">\<td>${esc(x.customer)}\</td>\<td>${esc(x.route)}\</td>\<td>${money(x.revenue,x.currency)}\</td>\<td>${money(x.cost,x.currency)}\</td>\<td>\<strong>${money(p,x.currency)}\</strong>\</td>\<td>${margin.toFixed(1)}%\</td>\<td>${tStatus(x.status)}\</td>\<td>${actionButtons("orders",x.id)}\</td>\</tr>\`;
&#x20;}).join("");
&#x20;return heading(t("orders.title"),t("orders.desc"),btnAdd("orders",t("orders.addBtn")))
&#x20;+\`\<div class="stats">${stat(t("orders.stat.count"),db.orders.length,t("orders.stat.countDesc"))}${stat(t("orders.stat.revenue"),money(revenue),t("orders.stat.revenueDesc"))}${stat(t("orders.stat.cost"),money(cost),t("orders.stat.costDesc"))}${stat(t("orders.stat.profit"),money(profit),t("orders.stat.profitDesc"))}\</div>\`

&#x20;+\`\<div class="note">${t("orders.note")}\</div>\`;
}

function openEditor(type,id){
&#x20;const schema=schemas[type];
&#x20;if(!schema)return;
&#x20;const existing=id?db[type].find(x=>x.id===id):null;
&#x20;editContext={type,id:id||null};
&#x20;$("modalTitle").textContent=(existing?t("modal.edit"):t("modal.new"))+" · "+t(schema.titleKey);
&#x20;$("modalBody").innerHTML=schema.fields.map(([key,labelKey,kind,required,options])=>{
&#x20; const value=existing?.[key]??(key==="status"?({"leads":"新询盘","followups":"待跟进","quotes":"草稿","orders":"待出运"}[type]):key==="currency"?"USD":"");
&#x20; let control="";
&#x20; if(kind==="select"){
&#x20;  control=\`\<select name="${key}" ${required?"required":""}>${options.map(o=>\`\<option value="${esc(o)}" ${value===o?"selected":""}>${tStatus(o)||o}\</option>\`).join("")}\</select>\`;
&#x20; }else if(kind==="textarea"){
&#x20;  control=\`\<textarea name="${key}" ${required?"required":""}>${esc(value)}\</textarea>\`;
&#x20; }else{
&#x20;  control=\`\<input name="${key}" type="${kind}" value="${esc(value)}" ${required?"required":""} ${kind==="number"?'min="0" step="any"':""}>\`;
&#x20; }
&#x20; return \`\<div class="field ${kind==="textarea"?"full":""}">\<label>${t(labelKey)}${required?" \*":""}\</label>${control}\</div>\`;
&#x20;}).join("");
&#x20;$("modal").showModal();
}
function closeModal(){ $("modal").close(); editContext=null; }

async function sendInquiryEmail(lead){
&#x20;if(!MAIL_CONFIG.enabled){ return "disabled"; }
&#x20;if(!MAIL_CONFIG.web3formsKey || MAIL_CONFIG.web3formsKey.indexOf("在这里填")===0){ return "nokey"; }
&#x20;const lines=[
&#x20; "【MORENICE CRM】新询盘",
&#x20; "------------------------------",
&#x20; "姓名："+(lead.name||""),
&#x20; "公司："+(lead.company||""),
&#x20; "国家/地区："+(lead.country||""),
&#x20; "邮箱："+(lead.email||""),
&#x20; "WhatsApp/电话："+(lead.phone||""),
&#x20; "货物类型："+(lead.product||""),
&#x20; "运输路线："+(lead.route||""),
&#x20; "运输方式/条款："+(lead.method||""),
&#x20; "体积："+(lead.volume||"")+" CBM",
&#x20; "询盘状态："+(lead.status||""),
&#x20; "下次跟进："+(lead.nextDate||""),
&#x20; "需求与备注："+(lead.notes||""),
&#x20; "------------------------------",
&#x20; "提交时间："+new Date().toLocaleString("zh-CN"),
&#x20; "来源页面："+location.href
&#x20;];
&#x20;const message=lines.join("\n");
&#x20;try{
&#x20; const res=await fetch("[https://api.web3forms.com/submit](https://api.web3forms.com/submit)",{
&#x20;  method:"POST",
&#x20;  headers:{"Content-Type":"application/json","Accept":"application/json"},
&#x20;  body:JSON.stringify({
&#x20;   access_key: MAIL_CONFIG.web3formsKey,
&#x20;   subject: "【MORENICE CRM】新询盘 - "+(lead.name||"未命名"),
&#x20;   from_name: "Morenice CRM",
&#x20;   replyto: lead.email||"",
&#x20;   message: message
&#x20;  })
&#x20; });
&#x20; const data=await res.json().catch(()=>({}));
&#x20; return data.success ? "ok" : "failed";
&#x20;}catch(e){ console.error(e); return "failed"; }
}

/\* ================= 表单提交 ================= \*/
$("editForm").addEventListener("submit",async e=>{
&#x20;e.preventDefault();
&#x20;if(!editContext)return;
&#x20;const {type,id}=editContext;
&#x20;const data=Object.fromEntries(new FormData(e.currentTarget).entries());
&#x20;if(type==="orders"||type==="quotes"||type==="leads"){
&#x20; if(data.amount!==undefined)data.amount=Number(data.amount)||0;
&#x20; if(data.revenue!==undefined)data.revenue=Number(data.revenue)||0;
&#x20; if(data.cost!==undefined)data.cost=Number(data.cost)||0;
&#x20; if(data.volume!==undefined)data.volume=Number(data.volume)||0;
&#x20;}
&#x20;let isNew=false;
&#x20;if(id){
&#x20; const i=db[type].findIndex(x=>x.id===id);
&#x20; if(i>=0)db[type][i]={...db[type][i],...data};
&#x20;}else{
&#x20; data.id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
&#x20; db[type].push(data);
&#x20; isNew=true;
&#x20;}
&#x20;if(save()){
&#x20; closeModal();
&#x20; render();
&#x20; // 新增客户询盘时，自动发邮件到后台
&#x20; if(type==="leads" && isNew){
&#x20;  const result=await sendInquiryEmail(data);
&#x20;  if(result==="ok") alert(t("alert.sendSuccess"));
&#x20;  else if(result==="disabled") alert(t("alert.sendDisabled"));
&#x20;  else if(result==="nokey") { /\* 未配置 key 时静默，不发提示 \*/ }
&#x20;  else alert(t("alert.sendFailed"));
&#x20; }
&#x20;}
});

function downloadFile(name,content,type){
&#x20;const blob=new Blob([content],{type});
&#x20;const url=URL.createObjectURL(blob);
&#x20;const a=document.createElement("a");a.href=url;a.download=name;a.click();
&#x20;setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportData(){ downloadFile("morenice-crm-backup.json",JSON.stringify(db,null,2),"application/json"); }
function csvCell(v){ return '"'+String(v??"").replace(/"/g,'""')+'"'; }
function exportCSV(){
&#x20;const fields=["name","company","country","email","phone","product","route","method","volume","status","nextDate","notes"];
&#x20;const csv=[fields.join(","),...db.leads.map(x=>fields.map(k=>csvCell(x[k])).join(","))].join("\r\n");
&#x20;downloadFile("morenice-customers.csv","\ufeff"+csv,"text/csv;charset=utf-8");
}
function importData(event){
&#x20;const file=event.target.files?.[0];
&#x20;if(!file)return;
&#x20;const reader=new FileReader();
&#x20;reader.onload=()=>{
&#x20; try{
&#x20;  const obj=JSON.parse(reader.result);
&#x20;  if(!obj||!["leads","followups","quotes","orders"].every(k=>Array.isArray(obj[k]))) throw Error("bad");
&#x20;  if(!confirm(t("alert.importConfirm")))return;
&#x20;  db=obj;
&#x20;  if(save()){ render(); alert(t("alert.importSuccess")); }
&#x20; }catch(e){ alert(t("alert.importFailed")); }
&#x20; event.target.value="";
&#x20;};
&#x20;reader.readAsText(file);
}
function clearData(){
&#x20;if(!confirm(t("alert.clear1")))return;
&#x20;if(!confirm(t("alert.clear2")))return;
&#x20;db=emptyDB(); save(); render();
}
